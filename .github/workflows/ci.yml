name: CI

on:
  push:
    branches: [main, David_T3]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install validation dependencies
        run: pip install -r requirements-dev.txt -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Validate processed data
        run: python -m pipeline.validate
      - name: Build Lambda bundle
        run: python infra/build.py
      - uses: aws-actions/setup-sam@v2
      - name: Validate SAM template
        run: sam validate --lint --region us-east-1 --template-file infra/template.yaml
