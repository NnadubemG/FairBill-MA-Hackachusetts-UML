<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FairBill MA — Compare prices</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { margin: 2rem; font-family: system-ui, sans-serif; color: #16202a; }
    h1 { font-size: 1.3rem; }
    .source-banner { font-size: .8rem; padding: .4rem .7rem; border-radius: 6px;
      background: #f1f5f8; border: 1px solid #dce3e8; display: inline-block; margin-bottom: 1rem; }
    .controls { margin-bottom: 1rem; }
    label { font-weight: 600; margin-right: .4rem; }
  </style>
</head>
<body>
  <h1>FairBill MA — Compare a procedure</h1>
  <p id="source" class="source-banner">Loading…</p>

  <div class="controls">
    <label for="code">Procedure code</label>
    <input id="code" value="99213" size="10" />
    <button id="go" type="button">Compare</button>
  </div>

  <div id="app" aria-live="polite"></div>

  <script type="module">
    import { mountCompare } from "./compare.mjs";
    import { fetchCompare } from "./api.mjs";

    const app = document.getElementById("app");
    const sourceEl = document.getElementById("source");
    const codeEl = document.getElementById("code");
    let component = null;

    async function loadSample() {
      const res = await fetch("./sample.json");
      return res.json();
    }

    async function getResult(code) {
      // Try the live API first; fall back to the bundled sample so the page
      // always renders something in a demo even with no server running.
      try {
        const data = await fetchCompare(code);
        sourceEl.textContent = "Source: live compare API (127.0.0.1:8000)";
        return data;
      } catch (e) {
        sourceEl.textContent =
          "Source: bundled sample data (compare API not reachable). Showing code 99213.";
        return loadSample();
      }
    }

    async function show(code) {
      const result = await getResult(code);
      if (component) component.setResult(result);
      else component = mountCompare(app, result);
    }

    document.getElementById("go").addEventListener("click", () => show(codeEl.value.trim()));
    codeEl.addEventListener("keydown", (e) => { if (e.key === "Enter") show(codeEl.value.trim()); });

    show(codeEl.value.trim());
  </script>
</body>
</html>
